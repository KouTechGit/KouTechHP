<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>授業動画 | KouTech</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <!-- MathJax for LaTeX math rendering -->
  <script id="MathJax-script" async src="../assets/lib/mathjax/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="../index.html" class="logo">
        <img src="../assets/img/logo.png" alt="KouTech">
      </a>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumbs">
      <a href="../index.html">Home</a> &gt; 授業動画
    </div>

    <section>
      <h1>授業動画</h1>
      <p>数学の単元ごとに動画で学習を進められます。</p>

      <div class="course-toolbar">
        <input type="search" id="global-search" class="global-search-input" placeholder="全科目から動画を検索（タイトルで検索）" aria-label="動画を検索">
        <a href="progress-map.html" id="progress-map-top-link" class="btn btn-outline">📊 進捗マップを見る</a>
      </div>

      <div id="global-search-results" class="global-search-results" hidden></div>

      <div id="tabs-container">
        <!-- JavaScript will populate tabs here -->
        <div style="padding:2rem; text-align:center; color:var(--text-sub);">Loading...</div>
      </div>

      <div id="tab-contents-container">
        <!-- JavaScript will populate tab contents here -->
      </div>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 KouTech</p>
  </footer>

  <script>
    /**
     * 科目名から色のCSS変数名を取得する
     * @param {string} subjectName - 科目名
     * @returns {Object} 色のCSS変数名
     */
    function getSubjectColors(subjectName) {
      let baseColor, lightColor;
      
      switch(subjectName) {
        case '数Ⅰ':
          baseColor = 'var(--subject-math1-base)';
          lightColor = 'var(--subject-math1-light)';
          break;
        case '数Ⅱ':
          baseColor = 'var(--subject-math2-base)';
          lightColor = 'var(--subject-math2-light)';
          break;
        case '数Ⅲ':
          baseColor = 'var(--subject-math3-base)';
          lightColor = 'var(--subject-math3-light)';
          break;
        case '数A':
          baseColor = 'var(--subject-mathA-base)';
          lightColor = 'var(--subject-mathA-light)';
          break;
        case '数B':
          baseColor = 'var(--subject-mathB-base)';
          lightColor = 'var(--subject-mathB-light)';
          break;
        case '数C':
          baseColor = 'var(--subject-mathC-base)';
          lightColor = 'var(--subject-mathC-light)';
          break;
        default:
          baseColor = 'var(--subject-math1-base)';
          lightColor = 'var(--subject-math1-light)';
      }
      
      return { baseColor, lightColor };
    }

    // 全科目横断検索用: index データと，遅延取得した単元動画データのキャッシュ
    let courseIndexData = null;
    let allVideosCache = null; // 初回検索時に全 unit JSON を取得して構築

    // Load course data index and render subjects/units
    fetch('course_data_index.json')
      .then(response => {
        // HTTPエラーステータスをチェック
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        courseIndexData = data;
        // データの構造をチェック
        if (!data || !data.subjects || !Array.isArray(data.subjects)) {
          throw new Error('Invalid course data format');
        }
        
        const tabsContainer = document.getElementById('tabs-container');
        const tabContentsContainer = document.getElementById('tab-contents-container');
        
        if (!tabsContainer || !tabContentsContainer) {
          console.error('Required containers not found');
          return;
        }
        
        tabsContainer.innerHTML = '';
        tabContentsContainer.innerHTML = '';

        // タブナビゲーションを作成
        const tabsDiv = document.createElement('div');
        tabsDiv.className = 'tabs';

        // 各科目のタブとコンテンツを作成
        data.subjects.forEach((subject, index) => {
          // 科目の色を取得
          const colors = getSubjectColors(subject.subject_name);
          
          // タブボタンを作成
          const tabButton = document.createElement('button');
          tabButton.className = 'tab';
          tabButton.textContent = subject.subject_name;
          tabButton.dataset.subject = subject.subject_name;
          // 科目の色を下線に適用
          tabButton.style.setProperty('--tab-color', colors.baseColor);
          if (index === 0) {
            tabButton.classList.add('active');
            tabButton.style.borderBottomColor = colors.baseColor;
          }

          // タブクリックイベント
          tabButton.addEventListener('click', function() {
            // すべてのタブからactiveクラスを削除し、下線の色をリセット
            document.querySelectorAll('.tab').forEach(tab => {
              tab.classList.remove('active');
              tab.style.borderBottomColor = 'transparent';
            });
            // クリックされたタブにactiveクラスを追加し、科目の色を下線に適用
            this.classList.add('active');
            const clickedSubject = this.dataset.subject;
            const clickedColors = getSubjectColors(clickedSubject);
            this.style.borderBottomColor = clickedColors.baseColor;

            // すべてのタブコンテンツからactiveクラスを削除
            document.querySelectorAll('.tab-content').forEach(content => {
              content.classList.remove('active');
            });
            // 対応するタブコンテンツにactiveクラスを追加
            const targetContent = document.querySelector(`.tab-content[data-subject="${clickedSubject}"]`);
            if (targetContent) {
              targetContent.classList.add('active');
            }

            // 進捗マップリンクを現在の科目に合わせる
            const progressMapTopLink = document.getElementById('progress-map-top-link');
            if (progressMapTopLink) {
              progressMapTopLink.href = `progress-map.html?subject=${encodeURIComponent(clickedSubject)}`;
            }
          });
          
          tabsDiv.appendChild(tabButton);

          // タブコンテンツを作成
          const tabContent = document.createElement('div');
          tabContent.className = 'tab-content';
          tabContent.dataset.subject = subject.subject_name;
          if (index === 0) {
            tabContent.classList.add('active');
          }

          const unitsList = document.createElement('div');
          unitsList.className = 'unit-cards-list';
          
          subject.units.forEach(unit => {
            const card = document.createElement('div');
            card.className = 'unit-card-horizontal';

            // 科目タグ（光る効果）- 基本色（濃い）を背景に適用
            const tag = document.createElement('span');
            tag.className = 'unit-card-subject-tag';
            tag.textContent = subject.subject_name;
            tag.style.background = colors.baseColor;
            card.appendChild(tag);

            // コンテンツエリア
            const content = document.createElement('div');
            content.className = 'unit-card-content';

            const title = document.createElement('div');
            title.className = 'unit-card-title';
            title.textContent = unit.unit_name;
            content.appendChild(title);

            const videoCount = document.createElement('p');
            videoCount.className = 'unit-card-video-count';
            videoCount.textContent = `${unit.video_count}本の動画`;
            content.appendChild(videoCount);

            card.appendChild(content);

            // 学習を開始するボタン（暗い→ホバーで光る）- ホバー時に基本色（薄い透過）を適用
            const link = document.createElement('a');
            link.href = `player.html?subject=${encodeURIComponent(subject.subject_name)}&unit=${encodeURIComponent(unit.unit_name)}`;
            link.className = 'unit-card-button';
            link.textContent = '学習を開始する';
            // データ属性に色を保存してCSS変数で使用
            link.dataset.subjectBaseColor = colors.baseColor;
            link.dataset.subjectLightColor = colors.lightColor;
            // ホバー時のスタイルを設定（インラインスタイルで確実に適用）
            link.addEventListener('mouseenter', function() {
              this.style.background = colors.lightColor;
              this.style.borderColor = colors.baseColor;
              this.style.color = '#fff';
            });
            link.addEventListener('mouseleave', function() {
              this.style.background = '';
              this.style.borderColor = '';
              this.style.color = '';
            });
            card.appendChild(link);

            unitsList.appendChild(card);
          });

          tabContent.appendChild(unitsList);
          tabContentsContainer.appendChild(tabContent);
        });

        tabsContainer.appendChild(tabsDiv);

        // 進捗マップリンクの初期値（最初の科目）
        const progressMapTopLink = document.getElementById('progress-map-top-link');
        if (progressMapTopLink && data.subjects.length > 0) {
          progressMapTopLink.href = `progress-map.html?subject=${encodeURIComponent(data.subjects[0].subject_name)}`;
        }
      })
      .catch(error => {
        console.error('Error loading course data:', error);
        // エラーの詳細をログに出力（デバッグ用）
        if (error.message) {
          console.error('Error message:', error.message);
        }
        // エラーメッセージを表示しない（ユーザー体験を優先）
        // 代わりに、読み込み中の表示を維持する
        const tabsContainer = document.getElementById('tabs-container');
        if (tabsContainer) {
          tabsContainer.innerHTML = '<div style="padding:2rem; text-align:center; color:var(--text-sub);">読み込み中...</div>';
        }
      });

    // ========================================================================
    // 全科目横断検索
    // ========================================================================

    /**
     * course_data_index.json に列挙された全 unit の JSON を取得し，
     * 科目・単元情報付きの動画フラットリストを構築します（初回検索時のみ実行してキャッシュ）。
     */
    function loadAllVideosForSearch() {
      if (allVideosCache) return Promise.resolve(allVideosCache);
      if (!courseIndexData) return Promise.resolve([]);

      const fetches = [];
      courseIndexData.subjects.forEach(subject => {
        subject.units.forEach(unit => {
          fetches.push(
            fetch(unit.file_path)
              .then(res => res.ok ? res.json() : null)
              .then(unitData => {
                if (!unitData || !Array.isArray(unitData.videos)) return [];
                return unitData.videos.map(v => ({
                  subject_name: subject.subject_name,
                  unit_name: unit.unit_name,
                  video_number: v.video_number,
                  title: v.title,
                  duration: v.duration,
                  youtube_id: v.youtube_id
                }));
              })
              .catch(() => [])
          );
        });
      });

      return Promise.all(fetches).then(lists => {
        allVideosCache = lists.flat();
        return allVideosCache;
      });
    }

    function renderSearchResults(query, videos) {
      const resultsContainer = document.getElementById('global-search-results');
      const tabsContainer = document.getElementById('tabs-container');
      const tabContentsContainer = document.getElementById('tab-contents-container');
      if (!resultsContainer) return;

      const matches = videos.filter(v => v.title.toLowerCase().includes(query));

      if (matches.length === 0) {
        resultsContainer.innerHTML = '<div style="padding:2rem; text-align:center; color:var(--text-sub);">該当する動画が見つかりません</div>';
      } else {
        resultsContainer.innerHTML = matches.slice(0, 100).map(v => {
          const colors = getSubjectColors(v.subject_name);
          const href = `player.html?subject=${encodeURIComponent(v.subject_name)}&unit=${encodeURIComponent(v.unit_name)}&video=${v.video_number}`;
          return `
            <a href="${href}" class="global-search-result-item">
              <span class="global-search-result-badge" style="background:${colors.baseColor}">${v.subject_name} ${v.unit_name}</span>
              <span class="global-search-result-title">${v.title}</span>
              <span class="global-search-result-duration">${v.duration || ''}</span>
            </a>
          `;
        }).join('');
      }

      resultsContainer.hidden = false;
      if (tabsContainer) tabsContainer.style.display = 'none';
      if (tabContentsContainer) tabContentsContainer.style.display = 'none';
    }

    function hideSearchResults() {
      const resultsContainer = document.getElementById('global-search-results');
      const tabsContainer = document.getElementById('tabs-container');
      const tabContentsContainer = document.getElementById('tab-contents-container');
      if (resultsContainer) resultsContainer.hidden = true;
      if (tabsContainer) tabsContainer.style.display = '';
      if (tabContentsContainer) tabContentsContainer.style.display = '';
    }

    const globalSearchInput = document.getElementById('global-search');
    if (globalSearchInput) {
      let debounceTimer = null;
      let isComposing = false;

      const runSearch = () => {
        const query = globalSearchInput.value.trim().toLowerCase();
        if (!query) {
          hideSearchResults();
          return;
        }
        const resultsContainer = document.getElementById('global-search-results');
        if (resultsContainer) {
          resultsContainer.hidden = false;
          resultsContainer.innerHTML = '<div style="padding:2rem; text-align:center; color:var(--text-sub);">検索中...</div>';
        }
        loadAllVideosForSearch().then(videos => renderSearchResults(query, videos));
      };

      globalSearchInput.addEventListener('compositionstart', () => { isComposing = true; });
      globalSearchInput.addEventListener('compositionend', () => {
        isComposing = false;
        runSearch();
      });

      globalSearchInput.addEventListener('input', () => {
        if (isComposing) return; // IME変換中は確定まで待つ
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runSearch, 250);
      });
    }
  </script>
</body>
</html>
